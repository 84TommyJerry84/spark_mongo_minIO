name: data-lake-pyspark

services:
  mongodb:
    image: mongo:8.0
    container_name: datalake-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${MONGO_INITDB_ROOT_USERNAME}",
          "--password",
          "${MONGO_INITDB_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "${MONGO_PORT}:27017"

    volumes:
      - mongo_data:/data/db


  minio:
    image: minio/minio
    container_name: datalake-minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5


  minio-init:
    image: minio/mc
    container_name: datalake-minio-init

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET}
      MINIO_ANALYTICS_BUCKET: ${MINIO_ANALYTICS_BUCKET}

    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local $${MINIO_ENDPOINT} $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_RAW_BUCKET};
      mc mb --ignore-existing local/$${MINIO_ANALYTICS_BUCKET};
      "


  spark-master:
    image: spark:4.1.2-python3
    container_name: datalake-spark-master
    hostname: spark-master

    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET}
      MINIO_ANALYTICS_BUCKET: ${MINIO_ANALYTICS_BUCKET}

      VELOV_STATIONS_URL: ${VELOV_STATIONS_URL}
      VELOV_AVAILABILITIES_URL: ${VELOV_AVAILABILITIES_URL}
      OPEN_METEO_URL: ${OPEN_METEO_URL}

      TIMEZONE: ${TIMEZONE}

      PYTHONPATH: /opt/spark

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    ports:
      - "${SPARK_MASTER_PORT}:7077"
      - "${SPARK_MASTER_WEBUI_PORT}:8080"

    volumes:
      - ../src:/opt/spark/src:ro
      - ../tests:/opt/spark/tests:ro
      - ./log4j2.properties:/opt/spark/conf/log4j2.properties:ro


  spark-worker:
    image: spark:4.1.2-python3
    container_name: datalake-spark-worker
    hostname: spark-worker

    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET}
      MINIO_ANALYTICS_BUCKET: ${MINIO_ANALYTICS_BUCKET}

      VELOV_STATIONS_URL: ${VELOV_STATIONS_URL}
      VELOV_AVAILABILITIES_URL: ${VELOV_AVAILABILITIES_URL}
      OPEN_METEO_URL: ${OPEN_METEO_URL}

      TIMEZONE: ${TIMEZONE}

      PYTHONPATH: /opt/spark

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    depends_on:
      - spark-master

    ports:
      - "8081:8081"

    volumes:
      - ../src:/opt/spark/src:ro
      - ./log4j2.properties:/opt/spark/conf/log4j2.properties:ro


  extraction:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: datalake-extraction

    depends_on:
      mongodb:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET}
      MINIO_ANALYTICS_BUCKET: ${MINIO_ANALYTICS_BUCKET}

      VELOV_STATIONS_URL: ${VELOV_STATIONS_URL}
      VELOV_AVAILABILITIES_URL: ${VELOV_AVAILABILITIES_URL}
      OPEN_METEO_URL: ${OPEN_METEO_URL}

      TIMEZONE: ${TIMEZONE}


volumes:
  mongo_data:
  minio_data: